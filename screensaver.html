<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiosk</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #05070d;
            color: #fff;
            font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            position: relative;
        }

        #map {
            position: fixed;
            inset: 0;
            z-index: -3;
            background: #05070d;
        }
        #map .basemap-pane img { filter: brightness(1.15) contrast(1.1); }
        .leaflet-container { pointer-events: none; }
        .leaflet-control-attribution {
            pointer-events: auto;
            background: transparent !important;
            color: rgba(255, 255, 255, 0.3) !important;
            font-size: 9px;
        }
        .leaflet-control-attribution a { color: inherit !important; }

        /* Darken top and bottom so text stays readable over radar */
        #scrim {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background:
                linear-gradient(to bottom, rgba(5,7,13,0.75) 0%, rgba(5,7,13,0) 38%),
                linear-gradient(to top, rgba(5,7,13,0.6) 0%, rgba(5,7,13,0) 25%);
        }

        #home {
            position: fixed;
            left: 50%;
            top: 50%;
            width: 1.6vw;
            height: 1.6vw;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 0 0.4vw rgba(255,255,255,0.25), 0 0 2vw rgba(160,200,255,0.9);
            z-index: 1;
            pointer-events: none;
        }
        #home::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.8);
            animation: ping 2.4s ease-out infinite;
        }
        @keyframes ping {
            from { transform: scale(1); opacity: 0.9; }
            to   { transform: scale(4); opacity: 0; }
        }

        #radar-time {
            position: fixed;
            right: 3vw;
            bottom: 1.5vw;
            font-size: 1.6vw;
            font-weight: 600;
            color: rgba(255,255,255,0.55);
            z-index: 1;
            text-shadow: 0 0 6px #000;
        }

        #content {
            position: fixed;
            inset: 0;
            padding: 2vw 3vw;
            z-index: 1;
            pointer-events: none;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
        }
        /* Album art mode: one translucent band across the bottom behind the clock/weather */
        #content::before {
            content: '';
            position: absolute;
            left: 0; right: 0; bottom: 0;
            height: 24vw;
            z-index: -1;
            background: rgba(0, 0, 0, 0.5);
            display: none;
        }
        body.art #content::before { display: block; }
        body.art #home,
        body.art #radar-time,
        body.art #scrim { display: none; }
        body.art #time-block,
        body.art #weather-block { top: auto; bottom: 1vw; }

        #now-playing {
            display: none;
            position: absolute;
            left: 3vw;
            top: 2vw;
            right: 3vw;
            font-size: 3.4vw;
            font-weight: 600;
            line-height: 1.25;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        body.art #now-playing { display: block; }
        #np-title { color: #fff; overflow: hidden; text-overflow: ellipsis; }
        #np-artist { color: #b8c0d0; overflow: hidden; text-overflow: ellipsis; }

        #time-block { position: absolute; left: 3vw; top: 1vw; }
        #weather-block { position: absolute; right: 3vw; top: 1vw; text-align: right; }

        #sonos-bg {
            position: fixed;
            inset: 0;
            z-index: -2;
            background-size: cover;
            background-position: center;
            filter: brightness(0.6);
            transform: scale(1.1);
            transition: background-image 0.8s ease-in-out;
        }

        #clock {
            font-size: 16vw;
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 1;
        }

        #date {
            font-size: 3.4vw;
            font-weight: 600;
            color: #b8c0d0;
            margin-top: 0.5vw;
            line-height: 4vw;
            height: 4vw;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        #weather {
            display: flex;
            flex-direction: column;
            gap: 0.5vw;
            align-items: flex-end;
        }

        .w-main {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0;
        }

        .w-temp {
            font-size: 16vw;
            font-weight: 700;
            letter-spacing: -0.03em;
            color: #fff;
            line-height: 1;
        }

        .w-condition {
            font-size: 3vw;
            font-weight: 600;
            margin-top: 0.5vw;
            line-height: 4vw;
            height: 4vw;
            display: flex;
            align-items: center;
            gap: 0.5vw;
            color: #ddd;
            letter-spacing: 0.05em;
        }

        .w-summary {
            font-size: 2.6vw;
            font-weight: 600;
        }

        .w-label-inline {
            color: #666;
        }

        .w-val-inline {
            color: #fff;
        }

        .w-loading {
            font-size: 1.5vw;
            color: #444;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="sonos-bg"></div>
    <div id="scrim"></div>
    <div id="home"></div>
    <div id="radar-time"></div>
    <div id="content">
        <div id="now-playing"><div id="np-title"></div><div id="np-artist"></div></div>
        <div id="time-block">
            <div id="clock">--:--</div>
            <div id="date">Loading...</div>
        </div>
        <div id="weather-block">
            <div id="weather"><span class="w-loading">Loading weather…</span></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const PW = {
            temp:      'sensor.pirateweather_temperature',
            summary:   'sensor.pirateweather_summary',
            high:      'sensor.pirateweather_daytime_high_temperature_0d',
            low:       'sensor.pirateweather_overnight_low_temperature_0d',
            precipPct: 'sensor.pirateweather_precip_probability_0d',
            precipType:'sensor.pirateweather_precip_0d',
            icon:      'sensor.pirateweather_icon',
        };

        const ICON_MDI = {
            'clear-day':           'mdi-weather-sunny',
            'clear-night':         'mdi-weather-night',
            'partly-cloudy-day':   'mdi-weather-partly-cloudy',
            'partly-cloudy-night': 'mdi-weather-night-partly-cloudy',
            'cloudy':              'mdi-weather-cloudy',
            'rain':                'mdi-weather-rainy',
            'sleet':               'mdi-weather-snowy-rainy',
            'snow':                'mdi-weather-snowy',
            'wind':                'mdi-weather-windy',
            'fog':                 'mdi-weather-fog',
            'thunderstorm':        'mdi-weather-lightning',
        };

        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').textContent = `${h}:${m}`;

            const DAYS   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
            const MONTHS = ['January','February','March','April','May','June',
                            'July','August','September','October','November','December'];
            document.getElementById('date').textContent =
                `${DAYS[now.getDay()]}, ${MONTHS[now.getMonth()]} ${now.getDate()}`;
        }

        async function haState(entity) {
            const res = await fetch(`/ha/api/states/${entity}`, { signal: AbortSignal.timeout(5000) });
            return (await res.json()).state;
        }

        async function fetchWeather() {
            try {
                const [temp, condition, high, low, precipPct, precipType, iconCode] = await Promise.all(
                    Object.values(PW).map(haState)
                );

                const type = (precipType && precipType !== 'none')
                    ? precipType.charAt(0).toUpperCase() + precipType.slice(1)
                    : null;
                const iconClass = ICON_MDI[iconCode] ?? 'mdi-weather-cloudy';

                document.getElementById('weather').innerHTML = `
                    <div class="w-main">
                        <div class="w-temp">${Math.round(temp)}°</div>
                        <div class="w-condition"><i class="mdi ${iconClass}"></i> ${condition}</div>
                    </div>
                    <div class="w-summary">
                        <span class="w-label-inline"><i class="mdi mdi-thermometer-high"></i></span> <span class="w-val-inline">${Math.round(high)}°</span>
                        &nbsp;&nbsp;<span class="w-label-inline"><i class="mdi mdi-thermometer-low"></i></span> <span class="w-val-inline">${Math.round(low)}°</span>
                        &nbsp;&nbsp;<span class="w-label-inline"><i class="mdi mdi-water-percent"></i></span> <span class="w-val-inline">${precipPct}%${type ? ' ' + type : ''}</span>
                    </div>
                `;
            } catch (e) {
                console.error('fetchWeather failed:', e);
                document.getElementById('weather').innerHTML =
                    '<span class="w-loading">Weather unavailable</span>';
            }
        }

        const SONOS_ROOMS = [
            { entity: 'media_player.kitchen_sonos' },
            { entity: 'media_player.living_room_sonos' },
            { entity: 'media_player.backyard_sonos' },
        ];

        async function updateSonosBackground() {
            for (const room of SONOS_ROOMS) {
                try {
                    const res = await fetch(`/ha/api/states/${room.entity}`, {
                        signal: AbortSignal.timeout(3000)
                    });
                    const data = await res.json();

                    // Check if playing and has entity_picture
                    const state = data.state;
                    const picture = data.attributes?.entity_picture;

                    if (state === 'playing' && picture) {
                        const artUrl = picture.startsWith('http') ? picture : `/ha${picture}`;
                        document.getElementById('sonos-bg').style.backgroundImage = `url('${artUrl}')`;
                        document.getElementById('np-title').textContent = data.attributes?.media_title ?? '';
                        document.getElementById('np-artist').textContent = data.attributes?.media_artist ?? '';
                        document.body.classList.add('art');
                        return;
                    }
                } catch {}
            }

            // No room playing
            document.getElementById('sonos-bg').style.backgroundImage = 'none';
            document.body.classList.remove('art');
        }

        // ---- Radar map background ----
        const LAT = 40.7598;
        const LON = -74.4160;
        const MAP_ZOOM = 8;
        const RADAR_FRAMES = 8;        // most recent frames to loop (10 min apart)
        const FRAME_MS = 700;
        const LAST_FRAME_MS = 2500;
        const RADAR_REFRESH_MS = 5 * 60 * 1000;

        const map = L.map('map', {
            center: [LAT, LON], zoom: MAP_ZOOM,
            zoomControl: false, dragging: false, touchZoom: false, doubleClickZoom: false,
            scrollWheelZoom: false, boxZoom: false, keyboard: false, tap: false,
            fadeAnimation: false, zoomAnimation: false,
        });
        const basePane = map.createPane('basemap');
        basePane.classList.add('basemap-pane');
        basePane.style.zIndex = 190;  // below the default tile pane (radar)
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
            pane: 'basemap', maxZoom: 12,
            attribution: 'Esri, HERE, Garmin, OpenStreetMap | Radar: RainViewer',
        }).addTo(map);

        let radarLayers = [];
        let radarTimes = [];
        let radarIdx = 0;
        let radarTimer = null;

        function showRadarFrame(i) {
            radarLayers.forEach((l, n) => l.setOpacity(n === i ? 0.65 : 0));
            const t = new Date(radarTimes[i] * 1000);
            document.getElementById('radar-time').textContent =
                `Radar ${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')}`;
        }

        function stepRadar() {
            radarIdx = (radarIdx + 1) % radarLayers.length;
            showRadarFrame(radarIdx);
            radarTimer = setTimeout(stepRadar,
                radarIdx === radarLayers.length - 1 ? LAST_FRAME_MS : FRAME_MS);
        }

        async function loadRadar() {
            try {
                const res = await fetch('https://api.rainviewer.com/public/weather-maps.json',
                    { signal: AbortSignal.timeout(8000) });
                const data = await res.json();
                const frames = data.radar.past.slice(-RADAR_FRAMES);

                clearTimeout(radarTimer);
                radarLayers.forEach(l => map.removeLayer(l));
                radarTimes = frames.map(f => f.time);
                // color scheme 2 (universal blue), smoothed, snow shown
                radarLayers = frames.map(f =>
                    L.tileLayer(`${data.host}${f.path}/256/{z}/{x}/{y}/2/1_1.png`, {
                        opacity: 0, maxNativeZoom: 7, maxZoom: 12, zIndex: 10,
                    }).addTo(map));

                radarIdx = radarLayers.length - 1;
                showRadarFrame(radarIdx);
                radarTimer = setTimeout(stepRadar, LAST_FRAME_MS);
            } catch (e) {
                console.error('loadRadar failed:', e);
            }
        }

        updateClock();
        setInterval(updateClock, 1000);
        loadRadar();
        setInterval(loadRadar, RADAR_REFRESH_MS);
        fetchWeather();
        setInterval(fetchWeather, 10 * 60 * 1000);
        updateSonosBackground();
        setInterval(updateSonosBackground, 5000);
    </script>
</body>
</html>
